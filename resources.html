<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>if(!sessionStorage.getItem("currentUser")){window.location.replace("index.html");}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Humanitarian aid, Beneficiary management, Web Applications, Aid Distribution">
    <title>H-AID | Resources</title>
    <link rel="stylesheet" href="css/all_min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/resources.css">
</head>
<body>
<div class="page-wrapper">

    <aside class="sidebar">
        <div class="logo">
            <img src="images/logo.png" alt="H-AID Logo">
            <div class="logo-text">
                <h1>H-AID</h1>
                <p>Humanitarian Aid<br>Distribution System</p>
            </div>
        </div>
        <div class="navbar">
            <nav class="menu">
                <a href="dashboard.html" class="nav-link">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
                <a href="resources.html" class="nav-link active">
                    <i class="fa-solid fa-box-archive"></i> Resources
                </a>
                <a href="beneficiaries.html" class="nav-link">
                    <i class="fa-solid fa-users"></i> Beneficiaries
                </a>
                <a href="distribution.html" class="nav-link">
                    <i class="fa-solid fa-truck"></i> Distribution
                </a>
                <a href="reports.html" class="nav-link">
                    <i class="fa-solid fa-chart-column"></i> Reports
                </a>
                <a href="setting.html" class="nav-link">
                    <i class="fa-solid fa-gear"></i> Settings
                </a>
            </nav>
        </div>
        <div class="logout" onclick="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Log Out</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Resources</h1>
            <p>Manage all available aid resources.</p>
        </div>

        <div class="content-card">
            <div class="content-card-header">
                <h2>All Resources</h2>
                <div style="display:flex;gap:10px;align-items:center;">
                    <input type="text" id="search" class="search-input" placeholder="Search resources...">
                    <button class="btn-primary" onclick="openModal()">
                        <i class="fa-solid fa-plus"></i> Add Resource
                    </button>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Resource Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h3 id="modal-title">Add Resource</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">
            <div class="form-group">
                <label>Resource Name</label>
                <input id="name" placeholder="Enter resource name">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="cat">
                    <option value="" disabled selected>Choose category</option>
                    <option value="Food">Food</option>
                    <option value="Hygiene">Hygiene</option>
                    <option value="Shelter">Shelter</option>
                    <option value="Drinks">Drinks</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input id="qty" placeholder="Enter quantity" type="number">
            </div>
            <div class="form-group">
                <label>Unit</label>
                <select id="unit">
                    <option value="" disabled selected>Choose unit</option>
                    <option value="Pack">Pack</option>
                    <option value="Piece">Piece</option>
                    <option value="Set">Set</option>
                    <option value="Kit">Kit</option>
                    <option value="Bottle">Bottle</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Description (Optional)</label>
            <textarea id="desc" placeholder="Enter description..." rows="3" style="resize:vertical;"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" id="saveBtn" onclick="addResource()">Save Resource</button>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/resources.js"></script>
</body>
</html>
